name: repo-to-ai-brief
one_liner: Generate reviewable coding-agent briefs from repositories.
target_user: Developers using coding agents
pain_point: Coding agents need concise, auditable repository context before editing.
demo_command: PYTHONPATH=src python3 -m repo_to_ai_brief examples/sample_repo --max-files 8 --max-chars 1200
tier: flagship
maturity_status: trend-aligned-2026-05-31
next_release: v0.2.1
polish_score: 92
topics:
  - ai-tools
  - coding-agents
  - developer-tools
  - cli
  - llm
  - repository
release_channel:
  - github
  - relevant-developer-communities
launch_copy:
  - I built repo-to-ai-brief to generate reviewable coding-agent briefs from repositories.
  - It respects .gitignore, supports changed-only mode, and stays small enough to inspect before pasting into an agent.
  - Try it with: PYTHONPATH=src python3 -m repo_to_ai_brief examples/sample_repo --max-files 8 --max-chars 1200
quality_gate:
  commands:
    - python3 -m unittest discover -s tests
metrics_goal:
  day_1_stars: 5
  day_3_stars: 15
  day_7_stars: 50
